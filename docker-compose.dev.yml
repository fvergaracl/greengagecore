# Local development: infrastructure only, Next.js runs with `npm run dev`
# Variable substitution reads from .env.local:
#   docker compose --env-file .env.local -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: greencrowd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - greencrowd_dev

  redis:
    image: redis:7-alpine
    container_name: greencrowd_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - greencrowd_dev

  minio:
    image: minio/minio:latest
    container_name: greencrowd_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    networks:
      - greencrowd_dev

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$MINIO_BUCKET;
        exit 0;
      "
    networks:
      - greencrowd_dev

  # ── GAME Engine — dedicated PostgreSQL ────────────────────────
  game_postgres:
    image: postgres:16-alpine
    container_name: greencrowd_game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAME_DB_NAME}
      POSTGRES_USER: ${GAME_DB_USER}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - game_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAME_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - greencrowd_dev

  # ── GAME DB init (one-shot: creates game_dev_db if missing) ───
  game_db_init:
    image: postgres:16-alpine
    container_name: greencrowd_game_db_init
    depends_on:
      game_postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${GAME_DB_PASSWORD}
      GAME_DB_USER: ${GAME_DB_USER}
      GAME_DB_NAME: ${GAME_DB_NAME}
    command: >
      sh -c "psql -h game_postgres -U $GAME_DB_USER -d postgres -tc
      \"SELECT 1 FROM pg_database WHERE datname='$GAME_DB_NAME'\" | grep -q 1 ||
      psql -h game_postgres -U $GAME_DB_USER -d postgres
      -c 'CREATE DATABASE $GAME_DB_NAME;'"
    networks:
      - greencrowd_dev
    restart: "no"

  # ── GAME Engine API ───────────────────────────────────────────
  game:
    image: fvergaracl/game:alpha
    container_name: greencrowd_game
    restart: unless-stopped
    environment:
      ENV: dev
      DB_ENGINE: postgresql
      DB_NAME: ${GAME_DB_NAME}
      DB_USER: ${GAME_DB_USER}
      DB_PASSWORD: ${GAME_DB_PASSWORD}
      DB_HOST: game_postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://${GAME_DB_USER}:${GAME_DB_PASSWORD}@game_postgres:5432/${GAME_DB_NAME}
      ALEMBIC_DATABASE_URL: postgresql://${GAME_DB_USER}:${GAME_DB_PASSWORD}@game_postgres:5432/${GAME_DB_NAME}
      SECRET_KEY: ${GAME_SECRET_KEY}
      DEFAULT_CONVERTION_RATE_POINTS_TO_COIN: 100
      ABUSE_PREVENTION_ENABLED: "false"
      API_URL_KPI: http://game:8000/api/v1/kpi
      # ── Keycloak (GreenCrowd realm) ─────────────────────────
      KEYCLOAK_REALM: greencrowd
      KEYCLOAK_CLIENT_ID: ${GAME_KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${GAME_KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_URL_DOCKER: http://keycloak:8080
      KEYCLOAK_AUDIENCE: ${GAME_KEYCLOAK_CLIENT_ID}
    ports:
      - "8000:8000"
    depends_on:
      game_db_init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks:
      - greencrowd_dev

  keycloak-init:
    image: python:3.12-alpine
    container_name: greencrowd_keycloak_init
    environment:
      KC_DEV_ADMIN_PASSWORD: ${KC_DEV_ADMIN_PASSWORD}
      KC_DEV_ADMIN_EMAIL: ${KC_DEV_ADMIN_EMAIL}
    volumes:
      - ./docker/keycloak/realm-export.json:/input/realm-export.json:ro
      - ./docker/keycloak/init-realm.py:/init-realm.py:ro
      - keycloak_import:/output
    command: ["python3", "/init-realm.py"]
    restart: "no"
    networks:
      - greencrowd_dev

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: greencrowd_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    networks:
      - greencrowd_dev

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
  game_postgres_dev_data:
  keycloak_import:

networks:
  greencrowd_dev:
    driver: bridge
