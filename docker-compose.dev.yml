# Local development: infrastructure only, Next.js runs with `npm run dev`
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: greencrowd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencrowd
      POSTGRES_PASSWORD: greencrowd_secret
      POSTGRES_DB: greencrowd
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencrowd"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - greencrowd_dev

  redis:
    image: redis:7-alpine
    container_name: greencrowd_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - greencrowd_dev

  minio:
    image: minio/minio:latest
    container_name: greencrowd_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: greencrowd_minio
      MINIO_ROOT_PASSWORD: minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    networks:
      - greencrowd_dev

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 greencrowd_minio minio_secret_key;
        mc mb --ignore-existing local/greencrowd-attachments;
        exit 0;
      "
    networks:
      - greencrowd_dev

  # ── GAME Engine — dedicated PostgreSQL ────────────────────────
  game_postgres:
    image: postgres:16-alpine
    container_name: greencrowd_game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_dev_db
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_secret
    ports:
      - "5433:5432"
    volumes:
      - game_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_user"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - greencrowd_dev

  # ── GAME DB init (one-shot: creates game_dev_db if missing) ───
  game_db_init:
    image: postgres:16-alpine
    container_name: greencrowd_game_db_init
    depends_on:
      game_postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: game_secret
    command: >
      sh -c "psql -h game_postgres -U game_user -d postgres -tc
      \"SELECT 1 FROM pg_database WHERE datname='game_dev_db'\" | grep -q 1 ||
      psql -h game_postgres -U game_user -d postgres
      -c 'CREATE DATABASE game_dev_db;'"
    networks:
      - greencrowd_dev
    restart: "no"

  # ── GAME Engine API ───────────────────────────────────────────
  game:
    image: fvergaracl/game:latest
    container_name: greencrowd_game
    restart: unless-stopped
    environment:
      ENV: dev
      DB_ENGINE: postgresql
      DB_NAME: game_dev_db
      DB_USER: game_user
      DB_PASSWORD: game_secret
      DB_HOST: game_postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://game_user:game_secret@game_postgres:5432/game_dev_db
      ALEMBIC_DATABASE_URL: postgresql://game_user:game_secret@game_postgres:5432/game_dev_db
      SECRET_KEY: dev_secret_key
      DEFAULT_CONVERTION_RATE_POINTS_TO_COIN: 100
      ABUSE_PREVENTION_ENABLED: "false"
      API_URL_KPI: http://game:8000/api/v1/kpi
      # ── Keycloak (GreenCrowd realm) ─────────────────────────
      KEYCLOAK_REALM: greencrowd
      KEYCLOAK_CLIENT_ID: game-backend
      KEYCLOAK_CLIENT_SECRET: game-backend-secret
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_URL_DOCKER: http://keycloak:8080
      KEYCLOAK_AUDIENCE: game-backend
    ports:
      - "8001:8000"
    depends_on:
      game_db_init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks:
      - greencrowd_dev

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: greencrowd_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/greencrowd
      KC_DB_USERNAME: greencrowd
      KC_DB_PASSWORD: greencrowd_secret
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secret
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - greencrowd_dev

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
  game_postgres_dev_data:

networks:
  greencrowd_dev:
    driver: bridge
