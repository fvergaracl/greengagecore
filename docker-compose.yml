services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 16 + PostGIS 3.4
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: greencrowd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greencrowd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greencrowd_secret}
      POSTGRES_DB: ${POSTGRES_DB:-greencrowd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greencrowd}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: greencrowd_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: greencrowd_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-greencrowd_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # MinIO bucket setup (one-shot init)
  # ─────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: greencrowd_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-greencrowd_minio} ${MINIO_ROOT_PASSWORD:-minio_secret_key};
        mc mb --ignore-existing local/${MINIO_BUCKET:-greencrowd-attachments};
        mc anonymous set download local/${MINIO_BUCKET:-greencrowd-attachments}/public;
        exit 0;
      "
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # Keycloak 26
  # ─────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: greencrowd_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-greencrowd}
      KC_DB_USERNAME: ${POSTGRES_USER:-greencrowd}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-greencrowd_secret}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # GAME Engine — dedicated PostgreSQL
  # ─────────────────────────────────────────────────────────────
  game_postgres:
    image: postgres:16-alpine
    container_name: greencrowd_game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAME_DB_NAME:-game_dev_db}
      POSTGRES_USER: ${GAME_DB_USER:-game_user}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD:-game_secret}
    volumes:
      - game_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAME_DB_USER:-game_user}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # GAME DB init (one-shot: creates DB if missing on stale volumes)
  # ─────────────────────────────────────────────────────────────
  game_db_init:
    image: postgres:16-alpine
    container_name: greencrowd_game_db_init
    depends_on:
      game_postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${GAME_DB_PASSWORD:-game_secret}
    command: >
      sh -c "psql -h game_postgres -U ${GAME_DB_USER:-game_user} -d postgres -tc
      \"SELECT 1 FROM pg_database WHERE datname='${GAME_DB_NAME:-game_dev_db}'\" | grep -q 1 ||
      psql -h game_postgres -U ${GAME_DB_USER:-game_user} -d postgres
      -c 'CREATE DATABASE ${GAME_DB_NAME:-game_dev_db};'"
    networks:
      - greencrowd_net
    restart: "no"

  # ─────────────────────────────────────────────────────────────
  # GAME Engine API
  # ─────────────────────────────────────────────────────────────
  game:
    image: fvergaracl/game:latest
    container_name: greencrowd_game
    restart: unless-stopped
    environment:
      ENV: prod
      DB_ENGINE: postgresql
      DB_NAME: ${GAME_DB_NAME:-game_dev_db}
      DB_USER: ${GAME_DB_USER:-game_user}
      DB_PASSWORD: ${GAME_DB_PASSWORD:-game_secret}
      DB_HOST: game_postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://${GAME_DB_USER:-game_user}:${GAME_DB_PASSWORD:-game_secret}@game_postgres:5432/${GAME_DB_NAME:-game_dev_db}
      ALEMBIC_DATABASE_URL: postgresql://${GAME_DB_USER:-game_user}:${GAME_DB_PASSWORD:-game_secret}@game_postgres:5432/${GAME_DB_NAME:-game_dev_db}
      SECRET_KEY: ${GAME_SECRET_KEY:-change_this_secret}
      DEFAULT_CONVERTION_RATE_POINTS_TO_COIN: 100
      ABUSE_PREVENTION_ENABLED: "false"
      API_URL_KPI: http://game:8000/api/v1/kpi
      # ── Keycloak (GreenCrowd realm) ─────────────────────────
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-greencrowd}
      KEYCLOAK_CLIENT_ID: ${GAME_KEYCLOAK_CLIENT_ID:-game-backend}
      KEYCLOAK_CLIENT_SECRET: ${GAME_KEYCLOAK_CLIENT_SECRET:-game-backend-secret}
      KEYCLOAK_URL: http://${KEYCLOAK_HOSTNAME:-localhost}:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_URL_DOCKER: http://keycloak:8080
      KEYCLOAK_AUDIENCE: ${GAME_KEYCLOAK_CLIENT_ID:-game-backend}
    ports:
      - "8000:8000"
    depends_on:
      game_db_init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/kpi"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - greencrowd_net

  game_apikey_provisioner:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    restart: "no"
    command: ["/app/node_modules/.bin/tsx", "scripts/provision-game-apikey.ts"]
    environment:
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:-greencrowd}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret}
      GAME_KEYCLOAK_CLIENT_ID: ${GAME_KEYCLOAK_CLIENT_ID:-game-backend}
      GAME_KEYCLOAK_CLIENT_SECRET: ${GAME_KEYCLOAK_CLIENT_SECRET:-game-backend-secret}
      API_GAME_BASE_URL: http://game:8000/api/v1
      GAME_APIKEY_ENV_FILE: /run/greencrowd/game-apikey.env
    volumes:
      - game_apikey_state:/run/greencrowd
    depends_on:
      keycloak:
        condition: service_healthy
      game:
        condition: service_healthy
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # GAME Health-check sidecar
  # ─────────────────────────────────────────────────────────────
  game_healthcheck:
    image: fvergaracl/game-health-check:latest
    container_name: greencrowd_game_healthcheck
    restart: unless-stopped
    environment:
      DB_HOST: game_postgres
      DB_NAME: ${GAME_DB_NAME:-game_dev_db}
      DB_USER: ${GAME_DB_USER:-game_user}
      DB_PASSWORD: ${GAME_DB_PASSWORD:-game_secret}
      API_URL_KPI: http://game:8000/api/v1/kpi
    depends_on:
      - game_postgres
      - game
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # GreenCrowd Next.js App
  # ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: greencrowd_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-greencrowd}:${POSTGRES_PASSWORD:-greencrowd_secret}@postgres:5432/${POSTGRES_DB:-greencrowd}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      API_GAME_BASE_URL: http://game:8000/api/v1
      GAME_APIKEY_ENV_FILE: /run/greencrowd/game-apikey.env
    command: ["./docker/start-with-game-apikey.sh", "node", "server.js"]
    volumes:
      - game_apikey_state:/run/greencrowd:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      game:
        condition: service_healthy
      game_apikey_provisioner:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # BullMQ Worker (same image, different CMD)
  # ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: greencrowd_worker
    restart: unless-stopped
    command: ["./docker/start-with-game-apikey.sh", "node", "dist/workers/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-greencrowd}:${POSTGRES_PASSWORD:-greencrowd_secret}@postgres:5432/${POSTGRES_DB:-greencrowd}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      API_GAME_BASE_URL: http://game:8000/api/v1
      GAME_APIKEY_ENV_FILE: /run/greencrowd/game-apikey.env
    volumes:
      - game_apikey_state:/run/greencrowd:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      game:
        condition: service_healthy
      game_apikey_provisioner:
        condition: service_completed_successfully
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: greencrowd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - greencrowd_net

  

volumes:
  postgres_data:
  redis_data:
  minio_data:
  game_postgres_data:
  game_apikey_state:

networks:
  greencrowd_net:
    driver: bridge
