version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 16 + PostGIS 3.4
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: greencrowd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greencrowd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greencrowd_secret}
      POSTGRES_DB: ${POSTGRES_DB:-greencrowd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greencrowd}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: greencrowd_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: greencrowd_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-greencrowd_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # MinIO bucket setup (one-shot init)
  # ─────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: greencrowd_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-greencrowd_minio} ${MINIO_ROOT_PASSWORD:-minio_secret_key};
        mc mb --ignore-existing local/${MINIO_BUCKET:-greencrowd-attachments};
        mc anonymous set download local/${MINIO_BUCKET:-greencrowd-attachments}/public;
        exit 0;
      "
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # Keycloak 26
  # ─────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: greencrowd_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-greencrowd}
      KC_DB_USERNAME: ${POSTGRES_USER:-greencrowd}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-greencrowd_secret}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # GreenCrowd Next.js App
  # ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: greencrowd_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-greencrowd}:${POSTGRES_PASSWORD:-greencrowd_secret}@postgres:5432/${POSTGRES_DB:-greencrowd}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # BullMQ Worker (same image, different CMD)
  # ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: greencrowd_worker
    restart: unless-stopped
    command: ["node", "dist/workers/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-greencrowd}:${POSTGRES_PASSWORD:-greencrowd_secret}@postgres:5432/${POSTGRES_DB:-greencrowd}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - greencrowd_net

  # ─────────────────────────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: greencrowd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - greencrowd_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  greencrowd_net:
    driver: bridge
